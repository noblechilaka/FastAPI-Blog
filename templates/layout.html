<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#f4f5f6">
    <meta name="description" content="Thoughtful notes on technology, creativity, and the things in between.">
    <link rel="icon" type="image/svg+xml" href="{{ url_for('static', path='/icons/favicon.svg') }}">
    <link rel="icon" type="image/svg+xml" sizes="32x32" href="{{ url_for('static', path='/icons/favicon-32.svg') }}">
    <link rel="apple-touch-icon" href="{{ url_for('static', path='/icons/apple-touch-icon.svg') }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="{{ url_for('static', path='/css/style.css') }}" rel="stylesheet">
    <script src="{{ url_for('static', path='/js/theme.js') }}" defer></script>
    <title>{% if title %}{{ title }} | Stillnote{% else %}Stillnote — Notes for curious minds{% endif %}</title>
</head>
<body>
    <nav class="navbar navbar-expand-lg site-nav">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center gap-2" href="{{ url_for('home') }}">
                <img class="brand-mark" src="{{ url_for('static', path='/icons/brand-mark.svg') }}" alt="">
                <span>stillnote</span>
            </a>
            <div class="d-flex align-items-center gap-2 ms-auto">
                <a class="nav-link d-none d-sm-inline-block" href="{{ url_for('home') }}#latest">Stories</a>
                <a class="nav-link d-none d-sm-inline-block" href="{{ url_for('home') }}#about">About</a>
                <button class="theme-toggle" type="button" aria-label="Switch to dark theme" title="Switch theme" data-theme-toggle>
                    <i class="bi bi-moon-stars" aria-hidden="true" data-theme-icon></i>
                </button>
                <a class="btn btn-dark btn-sm nav-cta" href="{{ url_for('home') }}#latest">Explore notes <i class="bi bi-arrow-up-right ms-1" aria-hidden="true"></i></a>
            </div>
        </div>
    </nav>

    <main>
        {% block content %}
        {% endblock %}
    </main>

    <footer class="site-footer">
        <div class="container d-flex flex-column flex-sm-row justify-content-between align-items-center gap-2">
            <span>© 2026 Stillnote. Made for curious minds.</span>
            <a href="#top" class="footer-link">Back to top <i class="bi bi-arrow-up" aria-hidden="true"></i></a>
        </div>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
